services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docufy-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: docufy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - docufydata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docufy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  docufydata:
