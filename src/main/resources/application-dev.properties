
# Application configuration
spring.application.name=docufy-backend
server.port=8081

# Database configurations
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docufy}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}



# JPA configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## OpenAI configurations
#spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
#spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
#spring.ai.openai.chat.temperature=0.2
#spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# Groq chat configuration
spring.ai.model.chat=openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.temperature=0.2

# Ollama embedding configuration
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text

# PGVector configurations
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.table-name=vector_store_ollama
#spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.initialize-schema=true

# File upload configurations
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
# App configurations
app.rag.chunk-size=700
# app.rag.chunk-overlap=100
app.rag.top-k=5
app.rag.similarity-threshold=0.0

# CORS configurations
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*